<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Candy Crush</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='5' cy='6' r='2.2' fill='%23fb7185'/%3E%3Ccircle cx='11' cy='6' r='2.2' fill='%236ea8ff'/%3E%3Ccircle cx='8' cy='11' r='2.2' fill='%23ffb020'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; --good:#3dd68c; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { min-height: 100vh; overflow-x: hidden; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .bar button {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .wrap { width: min(440px, calc(100% - 20px)); margin: 0 auto 40px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .hud { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
    .stat b { display: block; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .board-wrap { position: relative; }
    .board {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
      touch-action: none;
    }
    .cell {
      aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; background: #12151c;
      display: grid; place-items: center; cursor: pointer; position: relative;
    }
    .cell.on { box-shadow: 0 0 0 2px var(--accent) inset; }
    .candy {
      width: 78%; height: 78%; border-radius: 50%;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.28);
      transition: transform 120ms ease, opacity 120ms ease;
      pointer-events: none;
    }
    .candy.t0 { background: #fb7185; }
    .candy.t1 { background: #6ea8ff; }
    .candy.t2 { background: #3dd68c; }
    .candy.t3 { background: #ffb020; }
    .candy.t4 { background: #c084fc; }
    .candy.t5 { background: #67e8f9; }
    .candy.sq { border-radius: 8px; }
    .candy.dia { border-radius: 6px; transform: rotate(45deg) scale(.82); }
    .candy.heart { border-radius: 70% 70% 8px 8px; }
    .candy.pop { transform: scale(1.18); }
    .candy.out { transform: scale(0); opacity: 0; }
    .candy.s1 { background-image: repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,255,255,.45) 6px 8px); }
    .candy.s2 { background-image: repeating-linear-gradient(180deg, transparent 0 6px, rgba(255,255,255,.45) 6px 8px); }
    .candy.s3 { box-shadow: inset 0 0 0 3px #fff, 0 0 0 3px currentColor; }
    .candy.s4 {
      background: conic-gradient(#fb7185, #ffb020, #3dd68c, #6ea8ff, #c084fc, #fb7185);
      box-shadow: inset 0 0 0 4px #0f1115, 0 0 10px #ffb020;
      border-radius: 50%;
    }
    .overlay {
      position: absolute; inset: 0; border-radius: 16px; display: none;
      place-items: center; background: rgba(15,17,21,.78); text-align: center; z-index: 5; padding: 16px;
    }
    .overlay.show { display: grid; }
    .overlay b { display: block; font-size: 22px; margin-bottom: 4px; }
    .overlay span { color: var(--muted); font-size: 13px; }
    button.full {
      width: 100%; margin-top: 12px; appearance: none; background: var(--panel);
      border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px;
      cursor: pointer; font: inherit; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="mute">Sound on</button>
  </div>
  <div class="wrap">
    <h1>Candy Crush</h1>
    <p class="sub">Swap neighbors to make 3 in a row. Hold and drag, or tap two candies.</p>
    <div class="hud">
      <div class="stat"><span>Level</span><b id="level">1</b></div>
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Goal</span><b id="goal">2500</b></div>
      <div class="stat"><span>Moves</span><b id="moves">30</b></div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="overlay" id="over"><div><b id="overTitle">Clear</b><span id="overHint">Tap to continue</span></div></div>
    </div>
    <button class="full" type="button" id="restart">New game</button>
  </div>
  <script>
    (function () {
      const N = 8, KINDS = 6;
      const SHAPE = ["", "sq", "heart", "dia", "", "sq"];
      let grid, cells = [], selected = null, busy = false, score, moves, goal, level, combo;
      let muted, audioCtx, master, dragFrom = null;
      const boardEl = document.getElementById("board");
      const overEl = document.getElementById("over");
      const muteBtn = document.getElementById("mute");
      muted = localStorage.getItem("candy-mute") === "1";
      muteBtn.textContent = muted ? "Muted" : "Sound on";

      for (let i = 0; i < N * N; i++) {
        const b = document.createElement("button");
        b.className = "cell";
        b.type = "button";
        const r = Math.floor(i / N), c = i % N;
        b.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          if (busy || overEl.classList.contains("show")) return;
          try { b.setPointerCapture(e.pointerId); } catch (err) {}
          dragFrom = { r: r, c: c };
          pick(r, c);
        });
        b.addEventListener("pointerenter", function () {
          if (dragFrom && (dragFrom.r !== r || dragFrom.c !== c)) trySwap(dragFrom.r, dragFrom.c, r, c);
        });
        b.addEventListener("click", function (e) { e.preventDefault(); });
        boardEl.appendChild(b);
        cells.push(b);
      }
      boardEl.addEventListener("pointermove", function (e) {
        if (!dragFrom || busy) return;
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const cell = hit && hit.closest ? hit.closest(".cell") : null;
        if (!cell || !boardEl.contains(cell)) return;
        const i = cells.indexOf(cell);
        if (i < 0) return;
        const r = Math.floor(i / N), c = i % N;
        if (r !== dragFrom.r || c !== dragFrom.c) trySwap(dragFrom.r, dragFrom.c, r, c);
      });
      boardEl.addEventListener("pointerup", function () { dragFrom = null; });
      boardEl.addEventListener("pointercancel", function () { dragFrom = null; });

      function idx(r, c) { return r * N + c; }
      function inside(r, c) { return r >= 0 && c >= 0 && r < N && c < N; }
      function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
      function candy() { return { t: Math.floor(Math.random() * KINDS), s: 0 }; }
      function copyCell(x) { return x ? { t: x.t, s: x.s } : null; }

      function unlock() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.gain.value = muted ? 0 : 0.16;
          master.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function beep(freq, dur, type, vol, slide) {
        if (!audioCtx || muted) return;
        const t0 = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
        g.gain.setValueAtTime(vol || 0.1, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.02);
      }

      function paint() {
        cells.forEach(function (el, i) {
          const r = Math.floor(i / N), c = i % N, x = grid[r][c];
          el.classList.toggle("on", selected && selected.r === r && selected.c === c);
          if (!x) { el.innerHTML = ""; return; }
          const d = document.createElement("div");
          d.className = "candy t" + Math.max(0, x.t) + " " + (SHAPE[x.t] || "") + (x.s ? " s" + x.s : "");
          if (x.s === 4) d.className = "candy s4";
          el.innerHTML = "";
          el.appendChild(d);
        });
        document.getElementById("score").textContent = String(score);
        document.getElementById("moves").textContent = String(moves);
        document.getElementById("goal").textContent = String(goal);
        document.getElementById("level").textContent = String(level);
      }

      function swapCells(r1, c1, r2, c2) {
        const t = grid[r1][c1];
        grid[r1][c1] = grid[r2][c2];
        grid[r2][c2] = t;
      }

      function runsAt(g) {
        const h = [], v = [];
        for (let r = 0; r < N; r++) {
          let n = 1;
          for (let c = 1; c <= N; c++) {
            const same = c < N && g[r][c] && g[r][c - 1] && g[r][c].t >= 0 && g[r][c].t === g[r][c - 1].t;
            if (same) n++;
            else { if (n >= 3) h.push({ r: r, c0: c - n, c1: c - 1, n: n }); n = 1; }
          }
        }
        for (let c = 0; c < N; c++) {
          let n = 1;
          for (let r = 1; r <= N; r++) {
            const same = r < N && g[r][c] && g[r - 1][c] && g[r][c].t >= 0 && g[r][c].t === g[r - 1][c].t;
            if (same) n++;
            else { if (n >= 3) v.push({ c: c, r0: r - n, r1: r - 1, n: n }); n = 1; }
          }
        }
        return { h: h, v: v };
      }

      function matchSet(g) {
        const set = {};
        const rv = runsAt(g);
        rv.h.forEach(function (run) {
          for (let c = run.c0; c <= run.c1; c++) set[idx(run.r, c)] = true;
        });
        rv.v.forEach(function (run) {
          for (let r = run.r0; r <= run.r1; r++) set[idx(r, run.c)] = true;
        });
        return { set: set, runs: rv };
      }

      function hasMatch(g) { return Object.keys(matchSet(g).set).length > 0; }

      function wouldMatch(r1, c1, r2, c2) {
        const a = grid[r1][c1], b = grid[r2][c2];
        if (!a || !b) return false;
        if (a.s === 4 || b.s === 4 || (a.s && b.s)) return true;
        swapCells(r1, c1, r2, c2);
        const ok = hasMatch(grid);
        swapCells(r1, c1, r2, c2);
        return ok;
      }

      function hasMove() {
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          if (c + 1 < N && wouldMatch(r, c, r, c + 1)) return true;
          if (r + 1 < N && wouldMatch(r, c, r + 1, c)) return true;
        }
        return false;
      }

      function shuffle() {
        const pool = [];
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) pool.push(grid[r][c]);
        for (let k = 0; k < 40; k++) {
          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
          }
          let n = 0;
          for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = pool[n++];
          if (!hasMatch(grid) && hasMove()) return;
        }
      }

      function fillFresh() {
        grid = [];
        for (let r = 0; r < N; r++) {
          grid[r] = [];
          for (let c = 0; c < N; c++) {
            let x, guard = 0;
            do {
              x = candy();
              guard++;
              const left2 = c >= 2 && grid[r][c - 1].t === x.t && grid[r][c - 2].t === x.t;
              const up2 = r >= 2 && grid[r - 1][c].t === x.t && grid[r - 2][c].t === x.t;
              if (!left2 && !up2) break;
            } while (guard < 12);
            grid[r][c] = x;
          }
        }
        if (hasMatch(grid) || !hasMove()) shuffle();
      }

      function addClear(out, r, c) {
        if (!inside(r, c) || !grid[r][c]) return;
        out[idx(r, c)] = true;
      }

      function explodeFrom(out, fired, r, c) {
        const key = idx(r, c);
        if (fired[key] || !grid[r][c]) return;
        fired[key] = true;
        const s = grid[r][c].s;
        addClear(out, r, c);
        if (s === 1) { for (let i = 0; i < N; i++) addClear(out, r, i); }
        if (s === 2) { for (let i = 0; i < N; i++) addClear(out, i, c); }
        if (s === 3) {
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) addClear(out, r + dr, c + dc);
        }
        if (s === 4) {
          const counts = {};
          for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
            if (grid[rr][cc] && grid[rr][cc].t >= 0) counts[grid[rr][cc].t] = true;
          }
          const list = Object.keys(counts);
          if (list.length) {
            const color = +list[Math.floor(Math.random() * list.length)];
            for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
              if (grid[rr][cc] && grid[rr][cc].t === color) addClear(out, rr, cc);
            }
          }
        }
      }

      function resolveSpecialSwap(r1, c1, r2, c2, out, fired) {
        const a = grid[r1][c1], b = grid[r2][c2];
        if (a.s === 4 && b.s === 4) {
          for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) addClear(out, r, c);
          return true;
        }
        if (a.s === 4 || b.s === 4) {
          const color = a.s === 4 ? b.t : a.t;
          const other = a.s === 4 ? { r: r2, c: c2 } : { r: r1, c: c1 };
          addClear(out, r1, c1); addClear(out, r2, c2);
          for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
            if (grid[r][c] && grid[r][c].t === color) addClear(out, r, c);
          }
          if (grid[other.r][other.c] && grid[other.r][other.c].s) explodeFrom(out, fired, other.r, other.c);
          return true;
        }
        if (a.s && b.s) {
          explodeFrom(out, fired, r1, c1);
          explodeFrom(out, fired, r2, c2);
          return true;
        }
        return false;
      }

      function gravity() {
        for (let c = 0; c < N; c++) {
          let w = N - 1;
          for (let r = N - 1; r >= 0; r--) {
            if (grid[r][c]) { grid[w][c] = grid[r][c]; if (w !== r) grid[r][c] = null; w--; }
          }
          while (w >= 0) { grid[w][c] = candy(); w--; }
        }
      }

      async function cascade(swap) {
        combo = 0;
        let first = true;
        for (let step = 0; step < 20; step++) {
          const out = {}, fired = {};
          if (first && swap) resolveSpecialSwap(swap.r1, swap.c1, swap.r2, swap.c2, out, fired);
          first = false;
          const found = matchSet(grid);
          const keys = Object.keys(found.set);
          if (!keys.length && !Object.keys(out).length) break;
          keys.forEach(function (k) { out[k] = true; });
          Object.keys(out).forEach(function (k) {
            const r = Math.floor(+k / N), c = +k % N;
            if (grid[r][c] && grid[r][c].s) explodeFrom(out, fired, r, c);
          });
          let chained = true;
          while (chained) {
            chained = false;
            Object.keys(out).forEach(function (k) {
              const r = Math.floor(+k / N), c = +k % N;
              if (grid[r][c] && grid[r][c].s && !fired[+k]) {
                explodeFrom(out, fired, r, c);
                chained = true;
              }
            });
          }
          let spawn = null;
          const both = {};
          found.runs.h.forEach(function (run) {
            for (let c = run.c0; c <= run.c1; c++) both[idx(run.r, c)] = (both[idx(run.r, c)] || 0) | 1;
          });
          found.runs.v.forEach(function (run) {
            for (let r = run.r0; r <= run.r1; r++) both[idx(r, run.c)] = (both[idx(r, run.c)] || 0) | 2;
          });
          Object.keys(both).forEach(function (k) { if (both[k] === 3) spawn = { i: +k, s: 3 }; });
          found.runs.h.concat(found.runs.v).forEach(function (run) {
            if (run.n >= 5) {
              const i = idx(run.r !== undefined ? run.r : run.r0 + 2, run.c !== undefined ? run.c : run.c0 + 2);
              spawn = { i: i, s: 4 };
            } else if (run.n === 4 && (!spawn || spawn.s < 3)) {
              const s = run.r !== undefined ? 1 : 2;
              const mid = idx(run.r !== undefined ? run.r : Math.floor((run.r0 + run.r1) / 2), run.c !== undefined ? run.c : Math.floor((run.c0 + run.c1) / 2));
              spawn = { i: mid, s: s };
            }
          });
          if (spawn && swap) {
            const mi = idx(swap.moved.r, swap.moved.c);
            if (out[mi]) spawn.i = mi;
          }
          combo++;
          score += Object.keys(out).length * 60 * combo + (spawn ? 200 : 0);
          beep(380 + combo * 70, 0.08, "triangle", 0.08, 520 + combo * 80);
          Object.keys(out).forEach(function (k) {
            const el = cells[+k].querySelector(".candy");
            if (el) el.classList.add("out");
          });
          await wait(150);
          Object.keys(out).forEach(function (k) {
            const r = Math.floor(+k / N), c = +k % N;
            grid[r][c] = null;
          });
          if (spawn && out[spawn.i]) {
            const r = Math.floor(spawn.i / N), c = spawn.i % N;
            const color = (swap && swap.color >= 0) ? swap.color : Math.floor(Math.random() * KINDS);
            grid[r][c] = { t: spawn.s === 4 ? -1 : color, s: spawn.s };
          }
          gravity();
          paint();
          await wait(140);
          if (score >= goal) return "win";
        }
        if (!hasMove()) { shuffle(); paint(); beep(240, 0.12, "sine", 0.08); }
        return "ok";
      }

      function pick(r, c) {
        unlock();
        if (selected && !(selected.r === r && selected.c === c)) {
          trySwap(selected.r, selected.c, r, c);
          return;
        }
        selected = { r: r, c: c };
        paint();
      }

      async function trySwap(r1, c1, r2, c2) {
        if (busy) return;
        if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) { selected = { r: r2, c: c2 }; paint(); return; }
        busy = true;
        dragFrom = null;
        selected = null;
        if (!wouldMatch(r1, c1, r2, c2)) {
          swapCells(r1, c1, r2, c2); paint();
          beep(160, 0.08, "square", 0.05);
          await wait(120);
          swapCells(r1, c1, r2, c2); paint();
          busy = false;
          return;
        }
        const color = grid[r1][c1] && grid[r1][c1].t >= 0 ? grid[r1][c1].t : (grid[r2][c2] && grid[r2][c2].t);
        swapCells(r1, c1, r2, c2);
        paint();
        beep(420, 0.06, "sine", 0.07);
        moves--;
        const result = await cascade({ r1: r1, c1: c1, r2: r2, c2: c2, moved: { r: r2, c: c2 }, color: color });
        paint();
        busy = false;
        if (result === "win") return end(true);
        if (moves <= 0 && score < goal) return end(false);
      }

      function end(win) {
        busy = true;
        document.getElementById("overTitle").textContent = win ? "Level " + level + " clear" : "Out of moves";
        document.getElementById("overHint").textContent = win ? "Tap for the next level" : "Tap to retry";
        overEl.classList.add("show");
        if (win) { beep(523, 0.12, "sine", 0.1); beep(659, 0.16, "triangle", 0.1); beep(784, 0.28, "sine", 0.12); }
        else beep(140, 0.25, "triangle", 0.1, 70);
      }

      function startLevel(resetAll) {
        if (resetAll) level = 1;
        score = 0;
        goal = Math.round(1800 + level * 900);
        moves = Math.max(18, 30 - Math.floor(level / 2));
        busy = false;
        selected = null;
        dragFrom = null;
        overEl.classList.remove("show");
        fillFresh();
        paint();
      }

      overEl.addEventListener("click", function () {
        if (!overEl.classList.contains("show")) return;
        const win = document.getElementById("overTitle").textContent.indexOf("clear") >= 0;
        if (win) { level++; startLevel(false); }
        else { score = 0; startLevel(false); }
      });
      document.getElementById("restart").onclick = function () { startLevel(true); };
      window.addEventListener("keydown", function (e) {
        if (!overEl.classList.contains("show")) return;
        e.preventDefault();
        overEl.click();
      });
      muteBtn.onclick = function () {
        unlock();
        muted = !muted;
        localStorage.setItem("candy-mute", muted ? "1" : "0");
        muteBtn.textContent = muted ? "Muted" : "Sound on";
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.16, audioCtx.currentTime, 0.02);
      };
      startLevel(true);
    })();
  </script>
</body>
</html>
