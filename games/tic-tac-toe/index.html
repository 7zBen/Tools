<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic Tac Toe</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Cpath d='M4 4l8 8M12 4L4 12' stroke='%236ea8ff' stroke-width='1.8'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; --good:#3dd68c; --bad:#fb7185; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: space-between; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .wrap { width: min(380px, calc(100% - 32px)); margin: 0 auto 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .status { text-align: center; margin: 0 0 12px; min-height: 1.4em; color: var(--muted); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button.cell {
      aspect-ratio: 1; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 14px; font-size: 48px; cursor: pointer; font-family: inherit;
    }
    button.cell:disabled { cursor: default; }
    button.cell.win { background: #1c2a22; border-color: var(--good); color: var(--good); }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions button {
      flex: 1; appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="bar"><a href="../../">← Home</a></div>
  <div class="wrap">
    <h1>Tic Tac Toe</h1>
    <p class="sub">You are X. The computer plays a perfect O.</p>
    <p class="status" id="status">Your move</p>
    <div class="board" id="board"></div>
    <div class="actions"><button type="button" id="restart">New game</button></div>
  </div>
  <script>
    (function () {
      const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      let board, lock, cells = [];

      for (let i = 0; i < 9; i++) {
        const b = document.createElement("button");
        b.className = "cell";
        b.type = "button";
        b.addEventListener("click", function () { play(i); });
        boardEl.appendChild(b);
        cells.push(b);
      }

      function winner(b) {
        for (let i = 0; i < LINES.length; i++) {
          const L = LINES[i], a = b[L[0]];
          if (a && a === b[L[1]] && a === b[L[2]]) return { who: a, line: L };
        }
        if (b.every(Boolean)) return { who: "draw", line: null };
        return null;
      }

      function minimax(b, maxing) {
        const w = winner(b);
        if (w) return w.who === "O" ? 10 : w.who === "X" ? -10 : 0;
        let best = maxing ? -99 : 99;
        for (let i = 0; i < 9; i++) {
          if (b[i]) continue;
          b[i] = maxing ? "O" : "X";
          const v = minimax(b, !maxing);
          b[i] = "";
          best = maxing ? Math.max(best, v) : Math.min(best, v);
        }
        return best;
      }

      function aiMove() {
        let best = -99, pick = -1;
        for (let i = 0; i < 9; i++) {
          if (board[i]) continue;
          board[i] = "O";
          const v = minimax(board, false);
          board[i] = "";
          if (v > best) { best = v; pick = i; }
        }
        if (pick >= 0) {
          board[pick] = "O";
          cells[pick].textContent = "O";
          cells[pick].disabled = true;
        }
      }

      function finish(w) {
        lock = true;
        if (w.who === "draw") statusEl.textContent = "Draw";
        else if (w.who === "X") statusEl.textContent = "You win";
        else statusEl.textContent = "Computer wins";
        if (w.line) w.line.forEach(function (i) { cells[i].classList.add("win"); });
      }

      function play(i) {
        if (lock || board[i]) return;
        board[i] = "X";
        cells[i].textContent = "X";
        cells[i].disabled = true;
        let w = winner(board);
        if (w) return finish(w);
        lock = true;
        statusEl.textContent = "Computer…";
        setTimeout(function () {
          aiMove();
          w = winner(board);
          if (w) return finish(w);
          lock = false;
          statusEl.textContent = "Your move";
        }, 280);
      }

      function reset() {
        board = ["","","","","","","","",""];
        lock = false;
        statusEl.textContent = "Your move";
        cells.forEach(function (c) { c.textContent = ""; c.disabled = false; c.classList.remove("win"); });
      }
      document.getElementById("restart").onclick = reset;
      reset();
    })();
  </script>
</body>
</html>
