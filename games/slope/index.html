<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slope</title>
  <meta name="description" content="Slope — play fullscreen so the game boots at the right size." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Cpath d='M3 11 L8 5 L13 11' fill='none' stroke='%233dd68c' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --line: #2a3140;
      --text: #e8edf5;
      --muted: #8b95a8;
      --accent: #6ea8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px;
    }
    a.back { color: var(--muted); text-decoration: none; font-size: 13px; }
    a.back:hover { color: var(--accent); }
    h1 { margin: 16px 0 8px; font-size: 32px; letter-spacing: -.03em; }
    p { margin: 0 0 12px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    a.btn {
      display: inline-block; text-decoration: none; border-radius: 10px;
      padding: 10px 14px; font-size: 14px; border: 1px solid var(--line); color: var(--text);
    }
    a.play { background: #1f3a2c; border-color: #2e5a43; color: #b6f0d0; }
    a.play:hover { background: #254737; }
    .note { font-size: 12px; color: #6d778a; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <a class="back" href="../../">← Den</a>
    <h1>Slope</h1>
    <p>Endless downhill. Arrow keys or A/D to steer. The Unity build locks its size when it starts, so play it fullscreen instead of resizing a window around it.</p>
    <div class="actions">
      <a class="btn play" href="../../For%20Grok/slope/">Play fullscreen</a>
    </div>
    <p class="note">Opens the game in this tab at the full window size.</p>
  </div>
</body>
</html>
