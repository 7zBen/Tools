<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fill the Mug</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Crect x='5' y='5' width='6' height='8' rx='1' fill='none' stroke='%23ffb020' stroke-width='1.4'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; --beer:#e4b23a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: space-between; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .wrap { width: min(420px, calc(100% - 32px)); margin: 0 auto 48px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .target { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; }
    .readout { color: var(--muted); min-height: 1.4em; margin: 0 0 12px; }
    .stage { position: relative; height: 340px; margin: 0 auto; width: 260px; }
    .tap { position: absolute; left: 18px; top: 18px; width: 90px; height: 28px; background: #9aa3b2; border-radius: 6px 0 0 6px; }
    .tap:before { content:""; position:absolute; left:-12px; top:-10px; width:44px; height:48px; background:#6d7788; border-radius: 0 10px 10px 0; }
    .spout { position: absolute; left: 86px; top: 36px; width: 18px; height: 36px; background: #9aa3b2; border-radius: 0 0 12px 12px; }
    .handle {
      position: absolute; left: 78px; top: 0; width: 28px; height: 78px; cursor: pointer;
      background: transparent; border: 0; z-index: 3;
    }
    .handle span {
      display: block; width: 16px; height: 64px; margin: 0 auto; background: #e8edf5;
      border-radius: 8px 8px 4px 4px; transform-origin: 50% 100%; transition: transform 80ms;
    }
    .handle.on span { transform: rotate(8deg); }
    .pour {
      position: absolute; left: 91px; top: 70px; width: 8px; height: 0; background: var(--beer);
      border-radius: 4px; pointer-events: none; transition: height 80ms linear;
    }
    .pour.on { height: 148px; }
    .mug {
      position: absolute; left: 70px; top: 150px; width: 110px; height: 170px;
      border: 10px solid #d7dde8; border-top: 0; border-radius: 0 0 12px 12px;
    }
    .mug:after {
      content:""; position:absolute; right:-46px; top:28px; width:28px; height:78px;
      border: 10px solid #d7dde8; border-left: 0; border-radius: 0 40px 70px 0;
    }
    .liquid {
      position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
      max-height: 100%; overflow: hidden;
      background: linear-gradient(#fff 0 18%, #f3e7a6 22%, var(--beer) 26% 100%);
      background-size: 100% 220%;
      border-radius: 0 0 2px 2px;
    }
    .goal {
      position: absolute; left: 0; right: 0; height: 2px; background: var(--accent);
      box-shadow: 0 0 0 3px rgba(110,168,255,.25); z-index: 2;
    }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button {
      flex: 1; appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="bar"><a href="../../">← Home</a></div>
  <div class="wrap">
    <h1>Fill the Mug</h1>
    <p class="sub">Hold the tap. Stop on the line.</p>
    <p class="target">Fill to <span id="goalPct">50</span>%</p>
    <p class="readout" id="readout">Hold the handle or spacebar</p>
    <div class="stage">
      <div class="tap"></div>
      <div class="spout"></div>
      <button class="handle" id="handle" type="button" aria-label="Pour"><span></span></button>
      <div class="pour" id="pour"></div>
      <div class="mug" id="mug">
        <div class="goal" id="goalLine"></div>
        <div class="liquid" id="liquid"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="reset">New mug</button>
    </div>
  </div>
  <script>
    (function () {
      const liquid = document.getElementById("liquid");
      const pour = document.getElementById("pour");
      const handle = document.getElementById("handle");
      const readout = document.getElementById("readout");
      const goalLine = document.getElementById("goalLine");
      let level = 0, target = 50, pouring = false, done = false, last = 0, audioCtx, osc, gain;

      function setTarget() {
        target = 25 + Math.floor(Math.random() * 56);
        document.getElementById("goalPct").textContent = String(target);
        goalLine.style.bottom = target + "%";
      }
      function unlock() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          osc = audioCtx.createOscillator();
          gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = 90;
          gain.gain.value = 0;
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function setPour(on) {
        if (done && on) return;
        pouring = on;
        handle.classList.toggle("on", on);
        pour.classList.toggle("on", on);
        if (gain && audioCtx) gain.gain.setTargetAtTime(on ? 0.04 : 0, audioCtx.currentTime, 0.04);
      }
      function stop() {
        if (!pouring && level === 0) return;
        setPour(false);
        if (done) return;
        done = true;
        const diff = Math.abs(level - target);
        const rounded = Math.round(level);
        if (diff < 1) readout.textContent = "Nailed it — " + rounded + "%";
        else if (diff <= 4) readout.textContent = "Close enough — " + rounded + "% (target " + target + "%)";
        else readout.textContent = rounded + "% — target was " + target + "%";
      }
      function loop(t) {
        const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
        last = t;
        if (pouring && !done) {
          level = Math.min(100, level + 18 * dt);
          liquid.style.height = level + "%";
          if (level >= 100) stop();
        }
        requestAnimationFrame(loop);
      }
      function reset() {
        level = 0; done = false; pouring = false;
        liquid.style.height = "0%";
        readout.textContent = "Hold the handle or spacebar";
        setPour(false);
        setTarget();
      }
      handle.addEventListener("pointerdown", function (e) { e.preventDefault(); unlock(); if (!done) setPour(true); });
      window.addEventListener("pointerup", function () { if (pouring) stop(); });
      window.addEventListener("keydown", function (e) {
        if (e.code !== "Space" || e.repeat) return;
        e.preventDefault(); unlock(); if (!done) setPour(true);
      });
      window.addEventListener("keyup", function (e) { if (e.code === "Space" && pouring) stop(); });
      document.getElementById("reset").onclick = reset;
      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
