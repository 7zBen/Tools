  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; --good:#3dd68c; --mid:#ffb020; --bad:#232833; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: space-between; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .wrap { width: min(390px, calc(100% - 24px)); margin: 0 auto 32px; }
    h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; text-align: center; }
    .msg { text-align: center; min-height: 1.4em; color: var(--muted); margin: 0 0 10px; }
    .grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .tile {
      aspect-ratio: 1; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center;
      font-weight: 700; font-size: 22px; text-transform: uppercase; background: var(--panel);
      transition: transform 160ms ease;
    }
    .tile.filled { border-color: #3d4c68; }
    .tile.pop { transform: scale(1.08); }
    .tile.flip { animation: flip 420ms ease; }
    @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
    .tile.good { background: var(--good); color: #0f1115; border-color: var(--good); }
    .tile.mid { background: var(--mid); color: #0f1115; border-color: var(--mid); }
    .tile.bad { background: var(--bad); border-color: var(--bad); }
    .kb { display: grid; gap: 6px; }
    .kb-row { display: flex; gap: 5px; justify-content: center; }
    .kb button {
      flex: 1; min-height: 44px; max-width: 42px; border: 0; border-radius: 8px; background: #2a3140;
      color: var(--text); font: 600 13px/1 inherit; cursor: pointer; text-transform: uppercase;
    }
    .kb button.wide { max-width: 64px; font-size: 12px; }
    .kb button.good { background: var(--good); color: #0f1115; }
    .kb button.mid { background: var(--mid); color: #0f1115; }
    .kb button.bad { background: #12151c; color: var(--muted); }
    .actions { margin-top: 12px; }
    .actions button {
      width: 100%; appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
  </style>
</head>

        const rank = { good: 3, mid: 2, bad: 1 };
        const cur = k.classList.contains("good") ? 3 : k.classList.contains("mid") ? 2 : k.classList.contains("bad") ? 1 : 0;
        if ((rank[cls] || 0) > cur) { k.classList.remove("good","mid","bad"); k.classList.add(cls); }
      }

      function submit() {
        if (col < 5) { bump(); msg.textContent = "Need 5 letters"; return; }
        const guess = tiles[row].map(function (t) { return t.textContent.toLowerCase(); }).join("");
        if (!GUESSES.has(guess)) { bump(); msg.textContent = "Not in list"; return; }
        lock = true;
        const res = scoreGuess(guess, answer);
        res.forEach(function (cls, i) {
          setTimeout(function () {
            tiles[row][i].classList.add("flip", cls);
            paintKey(guess[i], cls);
          }, i * 90);
        });
        setTimeout(function () {
          if (guess === answer) { msg.textContent = "Got it"; lock = true; return; }
          row++; col = 0; lock = false;
          if (row >= 6) msg.textContent = "It was " + answer.toUpperCase();
          else msg.textContent = "";
        }, 620);
      }
      function bump() {
        const r = tiles[row][0].parentNode;
        r.style.transform = "translateX(-6px)";
        setTimeout(function () { r.style.transform = "translateX(6px)"; }, 60);
        setTimeout(function () { r.style.transform = ""; }, 120);
      }
      function handle(key) {
        if (lock) return;
        if (key === "Enter") return submit();
        if (key === "Backspace") {
          if (col > 0) {
            col--;
            tiles[row][col].textContent = "";
            tiles[row][col].classList.remove("filled","pop");
          }
          return;
        }
        const ch = key.toLowerCase();
        if (!/^[a-z]$/.test(ch) || col >= 5) return;
        tiles[row][col].textContent = ch;
        tiles[row][col].classList.add("filled","pop");
        setTimeout(function () { tiles[row][col > 0 ? col - 1 : 0].classList.remove("pop"); }, 120);
        col++;
      }
      window.addEventListener("keydown", function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === "Enter" || e.key === "Backspace" || /^[a-zA-Z]$/.test(e.key)) {
          e.preventDefault();
          handle(e.key);
        }
      });
      function reset() {
        answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
        row = 0; col = 0; lock = false; msg.textContent = "";
        tiles.forEach(function (r) { r.forEach(function (t) { t.textContent = ""; t.className = "tile"; }); });
        Object.keys(keys).forEach(function (k) { keys[k].classList.remove("good","mid","bad"); });
      }
      document.getElementById("restart").onclick = reset;
      reset();
    })();
  </script>
</body>
</html>
