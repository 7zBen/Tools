<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>7zBen</title>
  <meta name="description" content="Small browser tools and games." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='none' stroke='%236ea8ff' stroke-width='1.6'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e232d;
      --line: #2a3140;
      --text: #e8edf5;
      --muted: #8b95a8;
      --accent: #6ea8ff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; }
    header { margin-bottom: 36px; }
    .brand { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
    h1 { font-size: 36px; letter-spacing: -.03em; margin: 0 0 8px; }
    .lede { color: var(--muted); max-width: 46ch; margin: 0; }
    section { margin-bottom: 36px; }
    h2.section {
      font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 14px; font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 18px 16px; box-shadow: var(--shadow); min-height: 132px;
    }
    a.card:hover { border-color: #3d4c68; background: var(--panel-2); }
    a.card h3 { margin: 0 0 8px; font-size: 18px; letter-spacing: -.02em; }
    a.card p { margin: 0; color: var(--muted); font-size: 14px; }
    .slug { display: inline-block; margin-top: 14px; font-size: 11px; color: #6d778a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    footer { margin-top: 16px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="brand">7zBen</p>
      <h1 id="siteTitle">Home</h1>
      <p class="lede" id="siteDesc">Tools first, games underneath. Everything here runs in your browser.</p>
    </header>

    <section>
      <h2 class="section">Tools</h2>
      <p class="status" id="toolsStatus">Looking for tools…</p>
      <div class="grid" id="toolsGrid"></div>
    </section>

    <section>
      <h2 class="section">Games</h2>
      <p class="status" id="gamesStatus">Looking for games…</p>
      <div class="grid" id="gamesGrid"></div>
    </section>

    <footer><a href="https://github.com/7zBen">github.com/7zBen</a></footer>
  </div>
  <script>
    function humanize(slug) {
      return String(slug)
        .replace(/\.(html|md)$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    function pagesBase() {
      const parts = location.pathname.split("/").filter(Boolean);
      if (parts.length && !parts[parts.length - 1].includes(".")) {
        return "/" + parts.join("/");
      }
      if (parts.length) parts.pop();
      return parts.length ? "/" + parts.join("/") : "";
    }

    function detectGithub() {
      const host = location.hostname;
      const parts = location.pathname.split("/").filter(Boolean);
      if (host.endsWith(".github.io")) {
        const owner = host.slice(0, -".github.io".length);
        const repo = parts[0] || (owner + ".github.io");
        return { owner: owner, repo: repo };
      }
      return { owner: "7zBen", repo: "tools" };
    }

    function absHref(base, href, folder, slug) {
      if (href) {
        if (/^https?:\/\//i.test(href)) return href;
        if (href.charAt(0) === "/") return href;
        return base + "/" + href.replace(/^\.\//, "");
      }
      return base + "/" + folder + "/" + encodeURIComponent(slug) + "/";
    }

    async function fetchJson(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    async function exists(url) {
      try {
        const res = await fetch(url, { method: "GET", cache: "no-store" });
        return res.ok;
      } catch {
        return false;
      }
    }

    async function fromApi(owner, repo, base, folder, metaName) {
      if (!owner || !repo) return [];
      const res = await fetch(
        "https://api.github.com/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo) + "/contents/" + folder,
        { headers: { Accept: "application/vnd.github+json" } }
      );
      if (!res.ok) throw new Error("GitHub API " + res.status);
      const entries = await res.json();
      if (!Array.isArray(entries)) return [];
      const items = [];
      for (const entry of entries) {
        if (entry.type !== "dir" || !entry.name || entry.name.startsWith(".")) continue;
        const indexOk = await exists(base + "/" + folder + "/" + entry.name + "/index.html");
        if (!indexOk) continue;
        const meta = await fetchJson(base + "/" + folder + "/" + entry.name + "/" + metaName);
        items.push({
          slug: entry.name,
          name: (meta && meta.name) || humanize(entry.name),
          description: (meta && meta.description) || "",
          href: absHref(base, meta && meta.href, folder, entry.name),
          newTab: !!(meta && meta.newTab)
        });
      }
      return items;
    }

    async function fromManifest(base, folder) {
      const manifest = await fetchJson(base + "/" + folder + "/manifest.json");
      const list = manifest && (manifest.tools || manifest.games || manifest.items);
      if (!Array.isArray(list)) return [];
      return list.filter(function (item) { return item && item.slug; }).map(function (item) {
        return {
          slug: item.slug,
          name: item.name || humanize(item.slug),
          description: item.description || "",
          href: absHref(base, item.href, folder, item.slug),
          newTab: !!item.newTab
        };
      });
    }

    function mergeItems(discovered, extras) {
      const map = {};
      discovered.forEach(function (item) { map[item.slug] = item; });
      extras.forEach(function (item) {
        map[item.slug] = Object.assign({}, map[item.slug] || {}, item);
      });
      return Object.keys(map).map(function (k) { return map[k]; });
    }

    function render(grid, items) {
      grid.textContent = "";
      items.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (item) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = item.href;
        if (item.newTab) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        const h3 = document.createElement("h3");
        h3.textContent = item.name;
        const p = document.createElement("p");
        p.textContent = item.description;
        a.append(h3, p);
        grid.appendChild(a);
      });
    }

    async function loadSection(owner, repo, base, folder, metaName, grid, status) {
      let discovered = [];
      try { discovered = await fromApi(owner, repo, base, folder, metaName); } catch (err) { console.warn(err); }
      const extras = await fromManifest(base, folder);
      const items = mergeItems(discovered, extras);
      if (!items.length) {
        status.textContent = "Nothing here yet.";
        return;
      }
      status.textContent = "";
      render(grid, items);
    }

    (async function init() {
      const base = pagesBase();
      const site = (await fetchJson(base + "/site.json")) || {};
      if (site.title) {
        document.getElementById("siteTitle").textContent = site.title;
        document.title = site.title;
      }
      if (site.description) document.getElementById("siteDesc").textContent = site.description;

      const detected = detectGithub();
      const owner = (site.github && site.github.owner) || detected.owner;
      const repo = (site.github && site.github.repo) || detected.repo;

      await loadSection(owner, repo, base, "tools", "tool.json", document.getElementById("toolsGrid"), document.getElementById("toolsStatus"));
      await loadSection(owner, repo, base, "games", "game.json", document.getElementById("gamesGrid"), document.getElementById("gamesStatus"));
    })();
  </script>
</body>
</html>
